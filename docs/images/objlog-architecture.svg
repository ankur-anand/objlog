<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="700" viewBox="0 0 1280 700" role="img"
     aria-labelledby="title description">
  <title id="title">objlog architecture: write and read flow</title>
  <desc id="description">An animated example for one partition. Your application appends four records,
    receiving LSNs 120 through 123 after local acceptance. The fenced writer batches records by
    bytes, count, or age, seals and uploads an immutable segment, then writes catalog pages and
    conditionally updates the catalog head through its fence. Only successful publication advances
    the committed NextLSN from 120 to 124 and makes these records visible. An independent reader
    reads the catalog head and pages, then range-reads the requested segment blocks directly from
    the same object-storage bucket. The 16-second sequence repeats. With reduced motion enabled,
    the diagram shows the completed state without animation.</desc>

  <defs>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" class="data-arrow"/>
    </marker>
    <marker id="meta-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" class="meta-arrow"/>
    </marker>
    <path id="append-path" d="M172 308V366"/>
    <path id="upload-path" d="M296 520H500"/>
    <path id="publish-path" d="M296 418H382Q398 418 398 402V338Q398 322 414 322H500"/>
    <path id="discover-request-path" d="M1012 352H932Q916 352 916 336V302Q916 286 900 286H808"/>
    <path id="discover-response-path" d="M808 346H886Q902 346 902 362V386Q902 402 918 402H1012"/>
    <path id="range-request-path" d="M1012 464H808"/>
    <path id="range-response-path" d="M808 526H1012"/>
  </defs>

  <style>
    svg {
      font-family: Arial, Helvetica, sans-serif;
      color-scheme: only light;
    }
    text { fill: #24292f; }
    .background { fill: #ffffff; }
    .surface { fill: #ffffff; stroke: #c5cbd1; stroke-width: 1.2; }
    .data-soft { fill: #f0f7f3; }
    .bucket { fill: #fafafa; stroke: #aeb6be; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .muted { fill: #636c76; }
    .data { fill: #28765f; }
    .meta { fill: #525b64; }
    .small { font-size: 14px; }
    .body { font-size: 16px; }
    .label { font-size: 13px; font-weight: 600; }
    .node-title { font-size: 20px; font-weight: 600; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 14px; }
    .rule { stroke: #c5cbd1; }
    .route { fill: none; stroke-width: 1.5; stroke-linecap: round; }
    .data-route { stroke: #7d8790; marker-end: url(#data-arrow); }
    .meta-route { stroke: #7d8790; stroke-dasharray: 5 6; marker-end: url(#meta-arrow); }
    .data-arrow { fill: none; stroke: #7d8790; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .meta-arrow { fill: none; stroke: #7d8790; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .step { font-size: 15px; font-weight: 600; }
    .record-base { fill: #fafafa; stroke: #c5cbd1; }
    .record-fill { fill: #f0f7f3; stroke: #28765f; }
    .record { opacity: 1; animation: record-one 16s linear infinite; }
    .record.two { animation-name: record-two; }
    .record.three { animation-name: record-three; }
    .record.four { animation-name: record-four; }
    .segment-present { animation: segment 16s linear infinite; }
    .head-old { opacity: 0; animation: old-head 16s step-end infinite; }
    .head-new, .published { animation: committed 16s step-end infinite; }
    .received { animation: received 16s linear infinite; }
    .highlight { fill: none; stroke-width: 1.5; opacity: 0; }
    .writer-highlight { stroke: #28765f; animation: writer-active 16s linear infinite; }
    .segment-highlight { stroke: #28765f; animation: upload-active 16s linear infinite; }
    .catalog-highlight { stroke: #525b64; animation: publish-active 16s linear infinite; }
    .reader-highlight { stroke: #28765f; animation: read-active 16s linear infinite; }
    .packet { opacity: 0; }
    .phase { opacity: 0; animation: phase-one 16s step-end infinite; }
    .phase.two { animation-name: phase-two; }
    .phase.three { animation-name: phase-three; }
    .phase.four { animation-name: phase-four; }
    .phase.five { animation-name: phase-five; }
    .phase.six { animation-name: phase-six; }
    .caption { opacity: 0; }
    .static-caption { opacity: 1; animation: hide-static 16s step-end infinite; }
    @keyframes record-one { 0%, 4% { opacity: 0; } 6%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes record-two { 0%, 9% { opacity: 0; } 11%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes record-three { 0%, 14% { opacity: 0; } 16%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes record-four { 0%, 19% { opacity: 0; } 21%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes segment { 0%, 35% { opacity: 0; } 39%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes old-head { 0% { opacity: 1; } 53% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes committed { 0% { opacity: 0; } 53% { opacity: 1; } 97% { opacity: 0; } }
    @keyframes received { 0%, 79% { opacity: 0; } 83%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes writer-active { 0%, 25% { opacity: 1; } 28%, 100% { opacity: 0; } }
    @keyframes upload-active { 0%, 25% { opacity: 0; } 27%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes publish-active { 0%, 39% { opacity: 0; } 41%, 65% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes read-active { 0%, 55% { opacity: 0; } 57%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes phase-one { 0% { opacity: 1; } 12.5% { opacity: 0; } }
    @keyframes phase-two { 0% { opacity: 0; } 12.5% { opacity: 1; } 25% { opacity: 0; } }
    @keyframes phase-three { 0% { opacity: 0; } 25% { opacity: 1; } 40% { opacity: 0; } }
    @keyframes phase-four { 0% { opacity: 0; } 40% { opacity: 1; } 56.25% { opacity: 0; } }
    @keyframes phase-five { 0% { opacity: 0; } 56.25% { opacity: 1; } 70% { opacity: 0; } }
    @keyframes phase-six { 0% { opacity: 0; } 70% { opacity: 1; } }
    @keyframes hide-static { 0%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .packet, .head-old, .phase, .highlight { display: none; }
      .record, .segment-present, .head-new, .published, .received, .static-caption { opacity: 1; }
    }
  </style>

  <rect class="background" width="1280" height="700"/>
  <text x="48" y="59" font-size="28" font-weight="600">objlog architecture</text>
  <text x="48" y="89" class="body muted">Write, publish, and read directly from object storage.</text>
  <text x="1232" y="59" text-anchor="end" class="small muted">One partition · Example LSNs 120–123</text>

  <g transform="translate(0 -42)">
  <!-- Application and embedded writer. -->
  <text x="48" y="182" class="label muted">Writer process</text>
  <rect x="48" y="198" width="248" height="110" rx="2" class="surface"/>
  <text x="68" y="230" class="label data">1. Append</text>
  <text x="68" y="263" class="node-title">Application</text>
  <text x="68" y="288" class="mono muted">Append(record) → LSN</text>
  <text x="189" y="342" class="small muted">local acceptance</text>

  <rect x="48" y="366" width="248" height="224" rx="2" class="surface"/>
  <rect x="48" y="366" width="248" height="224" rx="2" class="highlight writer-highlight"/>
  <text x="68" y="398" class="label data">2. Batch</text>
  <text x="68" y="431" class="node-title">Fenced writer</text>
  <text x="68" y="457" class="body muted">One owner per partition</text>
  <g class="record-base">
    <rect x="68" y="482" width="46" height="40" rx="2"/>
    <rect x="122" y="482" width="46" height="40" rx="2"/>
    <rect x="176" y="482" width="46" height="40" rx="2"/>
    <rect x="230" y="482" width="46" height="40" rx="2"/>
  </g>
  <g text-anchor="middle" class="mono">
    <g class="record"><rect x="68" y="482" width="46" height="40" rx="2" class="record-fill"/><text x="91" y="507" class="data">120</text></g>
    <g class="record two"><rect x="122" y="482" width="46" height="40" rx="2" class="record-fill"/><text x="145" y="507" class="data">121</text></g>
    <g class="record three"><rect x="176" y="482" width="46" height="40" rx="2" class="record-fill"/><text x="199" y="507" class="data">122</text></g>
    <g class="record four"><rect x="230" y="482" width="46" height="40" rx="2" class="record-fill"/><text x="253" y="507" class="data">123</text></g>
  </g>
  <text x="68" y="550" class="small muted">Cut on bytes, count, or age</text>
  <text x="68" y="574" class="mono muted">Flush() waits for publish</text>

  <!-- Publication belongs to the writer; both objects live in the bucket. -->
  <text x="385" y="271" text-anchor="middle" class="step meta">4. Publish</text>
  <text x="385" y="293" text-anchor="middle" class="small muted">pages + head CAS</text>
  <text x="385" y="475" text-anchor="middle" class="step data">3. Seal + upload</text>
  <text x="385" y="497" text-anchor="middle" class="small muted">immutable segment</text>

  <rect x="474" y="198" width="360" height="392" rx="2" class="bucket"/>
  <text x="500" y="232" class="node-title">Object storage</text>
  <text x="500" y="256" class="small muted">S3 · GCS · Azure Blob · MinIO</text>

  <rect x="500" y="280" width="308" height="128" rx="2" class="surface"/>
  <rect x="500" y="280" width="308" height="128" rx="2" class="highlight catalog-highlight"/>
  <text x="520" y="310" class="label meta">Catalog</text>
  <text x="520" y="340" class="body">Head + immutable pages</text>
  <line x1="520" y1="354" x2="788" y2="354" class="rule"/>
  <text x="520" y="384" class="mono muted">NextLSN</text>
  <text x="594" y="384" class="mono head-old">120</text>
  <text x="594" y="384" class="mono data head-new">124</text>
  <g class="published">
    <text x="715" y="384" text-anchor="middle" class="small data" font-weight="600">Visible to readers</text>
  </g>

  <path d="M532 408V444" class="route meta-route"/>
  <text x="549" y="431" class="small muted">References segment objects</text>

  <rect x="500" y="444" width="308" height="124" rx="2" class="surface"/>
  <rect x="500" y="444" width="308" height="124" rx="2" class="highlight segment-highlight"/>
  <text x="520" y="474" class="label data">Segment objects</text>
  <text x="520" y="500" class="small muted">Data blocks + index + trailer</text>
  <rect x="520" y="514" width="268" height="34" rx="2" class="record-base"/>
  <g class="segment-present">
    <rect x="520" y="514" width="268" height="34" rx="2" class="record-fill"/>
    <text x="534" y="536" class="mono data">LSN 120–123</text>
    <g class="data" opacity="0.7">
      <rect x="690" y="523" width="18" height="16" rx="3"/>
      <rect x="714" y="523" width="18" height="16" rx="3"/>
      <rect x="738" y="523" width="18" height="16" rx="3"/>
      <rect x="762" y="523" width="12" height="16" rx="3"/>
    </g>
  </g>

  <!-- Independent readers issue requests to the bucket, never to the writer. -->
  <text x="930" y="230" text-anchor="middle" class="step meta">5. Discover</text>
  <text x="930" y="252" text-anchor="middle" class="small muted">read head + pages</text>
  <text x="930" y="389" text-anchor="middle" class="small meta">segment refs →</text>
  <text x="909" y="452" text-anchor="middle" class="small data">← range request</text>
  <text x="909" y="552" text-anchor="middle" class="step data">6. Range-read</text>
  <text x="909" y="574" text-anchor="middle" class="small muted">requested blocks →</text>

  <text x="1012" y="272" class="label muted">Reader process</text>
  <rect x="1012" y="290" width="220" height="300" rx="2" class="surface"/>
  <rect x="1012" y="290" width="220" height="300" rx="2" class="highlight reader-highlight"/>
  <text x="1032" y="324" class="label data">Read / replay / tail</text>
  <text x="1032" y="358" class="node-title">Reader</text>
  <text x="1032" y="386" class="body muted">Reads from the bucket</text>
  <text x="1032" y="411" class="small muted">Caches are disposable</text>
  <line x1="1032" y1="432" x2="1212" y2="432" class="rule"/>
  <text x="1032" y="461" class="mono muted">Read(StartLSN: 120)</text>
  <g class="received">
    <rect x="1032" y="482" width="180" height="74" rx="2" class="data-soft"/>
    <text x="1048" y="510" class="body data" font-weight="600">4 records returned</text>
    <text x="1048" y="536" class="mono data">120 121 122 123</text>
  </g>

  <!-- All edges remain visible in the first frame and when motion is disabled. -->
  <g aria-hidden="true">
    <use xlink:href="#append-path" class="route data-route"/>
    <use xlink:href="#upload-path" class="route data-route"/>
    <use xlink:href="#publish-path" class="route meta-route"/>
    <use xlink:href="#discover-request-path" class="route meta-route"/>
    <use xlink:href="#discover-response-path" class="route meta-route"/>
    <use xlink:href="#range-request-path" class="route data-route"/>
    <use xlink:href="#range-response-path" class="route data-route"/>
  </g>

  <!-- One synchronized 16 s clock. Packets traverse a path only in their phase;
       keyPoints keeps them at the endpoints while hidden between phases. -->
  <g aria-hidden="true">
    <g class="packet data">
      <rect x="-5" y="-5" width="10" height="10" rx="3"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.045;0.05;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.01;0.05;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#append-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-5" y="-5" width="10" height="10" rx="3"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.095;0.1;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.06;0.1;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#append-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-5" y="-5" width="10" height="10" rx="3"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.11;0.145;0.15;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.11;0.15;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#append-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-5" y="-5" width="10" height="10" rx="3"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.16;0.195;0.2;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.16;0.2;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#append-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-12" y="-8" width="24" height="16" rx="4"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.26;0.375;0.39;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.26;0.39;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#upload-path"/></animateMotion>
    </g>
    <g class="packet meta">
      <circle r="6"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.405;0.525;0.535;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.405;0.53;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#publish-path"/></animateMotion>
    </g>
    <g class="packet meta">
      <circle r="5"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.565;0.62;0.625;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.565;0.625;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#discover-request-path"/></animateMotion>
    </g>
    <g class="packet meta">
      <circle r="6"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.635;0.69;0.695;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.635;0.695;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#discover-response-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-4" y="-4" width="8" height="8" rx="2"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.705;0.755;0.76;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.705;0.76;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#range-request-path"/></animateMotion>
    </g>
    <g class="packet data">
      <rect x="-17" y="-6" width="10" height="12" rx="3"/>
      <rect x="-3" y="-6" width="10" height="12" rx="3"/>
      <rect x="11" y="-6" width="10" height="12" rx="3"/>
      <animate calcMode="discrete" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.77;0.82;0.83;1" dur="16s" repeatCount="indefinite"/>
      <animateMotion keyPoints="0;0;1;1" keyTimes="0;0.77;0.83;1" calcMode="linear" dur="16s" repeatCount="indefinite"><mpath xlink:href="#range-response-path"/></animateMotion>
    </g>
  </g>

  </g>

  <!-- The caption follows the active operation. -->
  <line x1="48" y1="588" x2="1232" y2="588" class="rule"/>
  <g class="small muted">
    <rect x="48" y="611" width="9" height="9" rx="2" class="data"/>
    <text x="66" y="621">Record / segment data</text>
    <circle cx="285" cy="616" r="5" class="meta"/>
    <text x="300" y="621">Catalog metadata</text>
    <text x="1232" y="621" text-anchor="end">16 s animation · Repeats</text>
  </g>
  <g class="body muted">
    <text x="48" y="664" class="phase caption">Append assigns an LSN and accepts the record locally. Publication comes later.</text>
    <text x="48" y="664" class="phase two caption">Records accumulate in the active batch. A policy limit or Flush() cuts the segment.</text>
    <text x="48" y="664" class="phase three caption">The writer seals and uploads the immutable segment before publishing its catalog reference.</text>
    <text x="48" y="664" class="phase four caption">The writer publishes pages, then updates the head with a fenced compare-and-swap. Records become visible.</text>
    <text x="48" y="664" class="phase five caption">The reader loads the committed catalog head and follows page references to find the segment.</text>
    <text x="48" y="664" class="phase six caption">The reader range-reads segment metadata and the requested blocks, then returns records in LSN order.</text>
    <text x="48" y="664" class="static-caption">Append accepts locally. Catalog publication commits visibility. Readers fetch directly from the bucket.</text>
  </g>
</svg>
